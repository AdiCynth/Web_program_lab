<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FinTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>FinTrack</h1>
        <p>Your Personal Financial Portfolio Tracker</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="1.html">JS Demo 1</a>
        <a href="2.html">JS Demo 2</a>
        <a href="3.html" class="active">Register</a>
    </nav>

    <main>
        <h2>Create Your Account</h2>

        <form action="#" method="post" name="regForm" onsubmit="return validationform()">
            <label>First Name: <input type="text" name="fname" required></label>
            <label>Last Name: <input type="text" name="lname" required></label>
            <label>Email: <input type="email" name="email" required></label>
            <label>Password: <input type="password" name="password" required></label>
            <label>Confirm Password: <input type="password" name="confirm_pass" required></label>

            <label>Gender:</label>
            <label><input type="radio" name="gender" value="male" required> Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
            <label><input type="radio" name="gender" value="other"> Other</label>

            <br>
            <button type="submit">Create Account</button>
        </form>

        <script>
            function validationform() {
                let fname = document.forms["regForm"]["fname"].value;
                let lname = document.forms["regForm"]["lname"].value;
                let password = document.forms["regForm"]["password"].value;
                let confirm_pass = document.forms["regForm"]["confirm_pass"].value;

                if (fname.length < 2) {
                    alert("First name must be at least 2 characters.");
                    return false;
                }
                if (lname.length < 2) {
                    alert("Last name must be at least 2 characters.");
                    return false;
                }
                if (password !== confirm_pass) {
                    alert("Passwords do not match. Please try again.");
                    return false;
                }
                if (password.length < 6) {
                    alert("Password must be at least 6 characters long.");
                    return false;
                }

                alert("Registration successful! Welcome to FinTrack.");
                return true;
            }
        </script>
    </main>

    <footer>
        <p>FinTrack &copy; 2024 &mdash; Financial Portfolio Tracker &nbsp;|&nbsp; Data is for educational purposes only</p>
    </footer>

</body>
</html>
