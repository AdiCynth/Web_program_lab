<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshVeg - Online Vegetable Seller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f7f6;
        }
        .text-veg {
            color: #2e7d32;
        }
        .bg-veg {
            background-color: #2e7d32;
        }
        .pagination .page-link {
            color: #2e7d32;
        }
        .pagination .page-item.active .page-link {
            background-color: #2e7d32;
            border-color: #2e7d32;
            color: white;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-veg shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-basket-fill me-2"></i>FreshVeg
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Shop</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Offers</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Categories
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="#">Organic</a></li>
                            <li><a class="dropdown-item" href="#">Leafy Greens</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Root Vegetables</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex" role="search" id="searchForm">
                    <div class="input-group">
                        <input class="form-control" type="search" placeholder="Search vegetables..." aria-label="Search" id="searchInput">
                        <button class="btn btn-outline-light" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5 pb-5">
        
        <div id="alertContainer"></div>

        <div class="d-flex flex-column align-items-center my-5">
            <img src="veg_basket.jpg" alt="Fresh Vegetables Basket" class="rounded-circle img-fluid border border-4 border-white shadow" style="width: 180px; height: 180px; object-fit: cover;">
            <h2 class="mt-3 text-veg fw-bold">Farm Fresh to Your Door</h2>
            <p class="text-muted">100% Organic & Locally Sourced Vegetables</p>
        </div>

        <h3 class="mb-4 text-center text-veg">Today's Harvest</h3>
        <div class="row g-4" id="productGrid"></div>

        <div class="mt-5 d-flex justify-content-center">
            <nav aria-label="Page navigation">
                <ul class="pagination shadow-sm" id="paginationContainer"></ul>
            </nav>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
