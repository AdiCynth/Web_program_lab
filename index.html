<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4: JavaScript</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>JavaScript Lab Exercises</h1>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-target="task1">Bill</button>
            <button class="tab-btn" data-target="task2">Dynamic Buttons</button>
            <button class="tab-btn" data-target="task3">Char Counter</button>
            <button class="tab-btn" data-target="task4">Registration Form</button>
            <button class="tab-btn" data-target="task5">Callbacks</button>
            <button class="tab-btn" data-target="task6">Promises</button>
            <button class="tab-btn" data-target="task7">Async</button>
        </nav>

        <main>
            <!-- Task 1 -->
            <section class="tab-content active" id="task1">
                <div class="task-card">
                    <h2>Calculate Total Bill</h2>
                    <button class="action-btn" id="btn-calc-bill">Calculate Bill</button>
                    <div id="task1-output" class="output-box"></div>
                </div>
            </section>

            <!-- Task 2 -->
            <section class="tab-content" id="task2">
                <div class="task-card">
                    <h2>Dynamic Buttons</h2>
                    <p style="margin-bottom: 1rem; color: #666; font-size: 0.9rem;">Click a button to change its text.</p>
                    <button class="action-btn dynamic-btn">Submit</button>
                    <button class="action-btn dynamic-btn">Cancel</button>
                    <button class="action-btn dynamic-btn">Reset</button>
                </div>
            </section>

            <!-- Task 3 -->
            <section class="tab-content" id="task3">
                <div class="task-card">
                    <h2>Character Counter</h2>
                    <textarea id="task3-input" placeholder="Start typing..."></textarea>
                    <div class="char-count">Characters: <span id="task3-count">0</span></div>
                </div>
            </section>

            <!-- Task 4 -->
            <section class="tab-content" id="task4">
                <div class="task-card">
                    <h2>Registration Form</h2>
                    <form id="reg-form">
                        <div class="form-group">
                            <label for="reg-name">Name</label>
                            <input type="text" id="reg-name" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-mobile">Mobile Number</label>
                            <input type="tel" id="reg-mobile" pattern="[0-9]{10}" placeholder="10 digits" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-email">Email</label>
                            <input type="email" id="reg-email" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-password">Password</label>
                            <input type="password" id="reg-password" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-confirm">Confirm Password</label>
                            <input type="password" id="reg-confirm" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-gender">Gender</label>
                            <select id="reg-gender" required>
                                <option value="">Select</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <button type="submit" class="action-btn">Register</button>
                        <div id="reg-output" class="output-box"></div>
                    </form>
                </div>
            </section>

            <!-- Task 5 -->
            <section class="tab-content" id="task5">
                <div class="task-card">
                    <h2>Food Delivery (Callbacks)</h2>
                    <button class="action-btn" id="btn-callbacks">Order Food</button>
                    <div id="task5-output" class="output-box log-box"></div>
                </div>
            </section>

            <!-- Task 6 -->
            <section class="tab-content" id="task6">
                <div class="task-card">
                    <h2>E-commerce Order (Promises)</h2>
                    <button class="action-btn" id="btn-promises">Place Order</button>
                    <div id="task6-output" class="output-box log-box"></div>
                </div>
            </section>

            <!-- Task 7 -->
            <section class="tab-content" id="task7">
                <div class="task-card">
                    <h2>Movie Ticket (Async/Await)</h2>
                    <button class="action-btn" id="btn-async">Book Ticket</button>
                    <div id="task7-output" class="output-box log-box"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
